services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configure MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Configure MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrations:
    build:
      context: .
      dockerfile: src/Plataforma.AuthApi/Dockerfile.migrations
    environment:
      ConnectionStrings__Platform: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User ID=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  auth-api:
    build:
      context: .
      dockerfile: src/Plataforma.AuthApi/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Platform: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User ID=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER:-plataforma-auth}
      Jwt__Audience: ${JWT_AUDIENCE:-plataforma-games}
      Jwt__SigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:?Configure JWT_SIGNING_KEY_BASE64 in .env}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Email__Host: ${EMAIL_SMTP_HOST:-}
      Email__Port: ${EMAIL_SMTP_PORT:-587}
      Email__Username: ${EMAIL_SMTP_USERNAME:-}
      Email__Password: ${EMAIL_SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-Plataforma}
      PasswordReset__PublicUrl: ${PASSWORD_RESET_PUBLIC_URL:-}
      GameDelivery__SandboxTestModeEnabled: ${GAME_DELIVERY_SANDBOX_TEST_MODE_ENABLED:-false}
      GameDelivery__CdnBaseUrl: ${BUNNY_CDN_BASE_URL:-}
      GameDelivery__CdnTokenAuthKey: ${BUNNY_CDN_TOKEN_AUTH_KEY:-}
      GameDelivery__TokenLifetimeSeconds: ${GAME_DELIVERY_TOKEN_LIFETIME_SECONDS:-600}
      GameDelivery__LauncherWindowsObjectPath: ${PLATFORM_LAUNCHER_WINDOWS_OBJECT_PATH:-}
      GameDelivery__LauncherMacOsX64ObjectPath: ${PLATFORM_LAUNCHER_MACOS_X64_OBJECT_PATH:-}
      GameDelivery__LauncherMacOsArm64ObjectPath: ${PLATFORM_LAUNCHER_MACOS_ARM64_OBJECT_PATH:-}
      GameDelivery__LauncherLinuxX64ObjectPath: ${PLATFORM_LAUNCHER_LINUX_X64_OBJECT_PATH:-}
      GameDelivery__LauncherUpdatesDirectoryPath: ${PLATFORM_LAUNCHER_UPDATES_DIRECTORY_PATH:-}
      GameDelivery__LauncherUpdateTokenLifetimeSeconds: ${GAME_DELIVERY_LAUNCHER_UPDATE_TOKEN_LIFETIME_SECONDS:-3600}
      GameDelivery__Builds__dash-and-crash__WindowsObjectPath: ${DASH_AND_CRASH_WINDOWS_OBJECT_PATH:-}
      GameDelivery__Builds__dash-and-crash__WebGlDirectoryPath: ${DASH_AND_CRASH_WEBGL_DIRECTORY_PATH:-}
      GameDelivery__Builds__dash-and-crash__WebGlEntryPoint: ${DASH_AND_CRASH_WEBGL_ENTRY_POINT:-index.html}
    volumes:
      - auth_api_data_protection_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AUTH_API_PORT:-5000}:8080"
    restart: unless-stopped

  massive-server:
    build:
      context: .
      dockerfile: src/Games.MassiveServer/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      GameAuth__BaseUrl: http://auth-api:8080
      GameAuth__TimeoutSeconds: ${GAME_AUTH_TIMEOUT_SECONDS:-5}
      GameAuth__JwtIssuer: ${JWT_ISSUER:-plataforma-auth}
      GameAuth__JwtAudience: ${JWT_AUDIENCE:-plataforma-games}
      GameAuth__JwtSigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:-}
      GameAuth__RequiredGameSlug: ${MASSIVE_REQUIRED_GAME_SLUG:-}
      GameServer__UdpPort: ${GAME_SERVER_UDP_PORT:-9050}
      GameServer__PublicAddress: ${GAME_SERVER_PUBLIC_ADDRESS:-127.0.0.1}
      GameServer__PublicWebSocketUrl: ${GAME_SERVER_PUBLIC_WS_URL:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      GameServer__TickIntervalMs: ${GAME_SERVER_TICK_INTERVAL_MS:-5}
      GameServer__HandshakeTimeoutSeconds: ${GAME_SERVER_HANDSHAKE_TIMEOUT_SECONDS:-5}
      GameServer__MaxConnectionRequestsPerIpPerWindow: ${GAME_SERVER_MAX_CONN_PER_IP:-10}
      GameServer__ConnectionRequestWindowSeconds: ${GAME_SERVER_CONN_WINDOW_SECONDS:-10}
      GameServer__MaxPacketsPerSecondPerPeer: ${GAME_SERVER_MAX_PACKETS_PER_SECOND:-90}
      GameServer__MaximumGameDataBytes: ${GAME_SERVER_MAX_GAME_DATA_BYTES:-1024}
      GameServer__EnableLegacyPing: ${GAME_SERVER_ENABLE_LEGACY_PING:-true}
      GameServer__EnableWebSocketTransport: ${GAME_SERVER_ENABLE_WEBSOCKET_TRANSPORT:-true}
      GameServer__RequireEncryptedUdp: ${GAME_SERVER_REQUIRE_ENCRYPTED_UDP:-false}
      GameServer__StateRelayIntervalMs: ${MASSIVE_STATE_RELAY_INTERVAL_MS:-25}
      Matchmaking__GameCode: ${MASSIVE_GAME_CODE:-arena-massive}
      Matchmaking__MinPlayers: ${MASSIVE_MIN_PLAYERS:-1}
      Matchmaking__MaxPlayers: ${MASSIVE_MAX_PLAYERS:-50}
      Matchmaking__MatchStartDelaySeconds: ${MASSIVE_MATCH_START_DELAY_SECONDS:-0}
      Matchmaking__QueueTimeoutSeconds: ${MATCHMAKING_QUEUE_TIMEOUT_SECONDS:-60}
      Matchmaking__ConnectionTicketLifetimeSeconds: ${MATCHMAKING_TICKET_LIFETIME_SECONDS:-120}
      Logging__LogLevel__Games.MassiveServer: ${GAME_SERVER_LOG_LEVEL:-Debug}
    depends_on:
      auth-api:
        condition: service_started
    ports:
      - "127.0.0.1:${MATCHMAKING_API_PORT:-5001}:8080"
      - "${GAME_SERVER_UDP_BIND_ADDRESS:-127.0.0.1}:${GAME_SERVER_UDP_PORT:-9050}:${GAME_SERVER_UDP_PORT:-9050}/udp"
    restart: unless-stopped

  coop-server:
    build:
      context: .
      dockerfile: src/Games.CoopServer/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      GameAuth__BaseUrl: http://auth-api:8080
      GameAuth__TimeoutSeconds: ${GAME_AUTH_TIMEOUT_SECONDS:-5}
      GameAuth__JwtIssuer: ${JWT_ISSUER:-plataforma-auth}
      GameAuth__JwtAudience: ${JWT_AUDIENCE:-plataforma-games}
      GameAuth__JwtSigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:-}
      GameAuth__RequiredGameSlug: ${COOP_REQUIRED_GAME_SLUG:-}
      GameServer__UdpPort: ${COOP_GAME_SERVER_UDP_PORT:-9051}
      GameServer__PublicAddress: ${COOP_GAME_SERVER_PUBLIC_ADDRESS:-127.0.0.1}
      GameServer__PublicWebSocketUrl: ${COOP_GAME_SERVER_PUBLIC_WS_URL:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      GameServer__TickIntervalMs: ${GAME_SERVER_TICK_INTERVAL_MS:-5}
      GameServer__HandshakeTimeoutSeconds: ${GAME_SERVER_HANDSHAKE_TIMEOUT_SECONDS:-5}
      GameServer__MaxConnectionRequestsPerIpPerWindow: ${GAME_SERVER_MAX_CONN_PER_IP:-10}
      GameServer__ConnectionRequestWindowSeconds: ${GAME_SERVER_CONN_WINDOW_SECONDS:-10}
      GameServer__MaxPacketsPerSecondPerPeer: ${GAME_SERVER_MAX_PACKETS_PER_SECOND:-90}
      GameServer__MaximumGameDataBytes: ${GAME_SERVER_MAX_GAME_DATA_BYTES:-1024}
      GameServer__EnableLegacyPing: ${GAME_SERVER_ENABLE_LEGACY_PING:-true}
      GameServer__EnableWebSocketTransport: ${GAME_SERVER_ENABLE_WEBSOCKET_TRANSPORT:-true}
      GameServer__RequireEncryptedUdp: ${GAME_SERVER_REQUIRE_ENCRYPTED_UDP:-false}
      GameServer__StateRelayIntervalMs: ${COOP_STATE_RELAY_INTERVAL_MS:-0}
      Matchmaking__GameCode: ${COOP_GAME_CODE:-arena-coop}
      Matchmaking__MinPlayers: ${COOP_MIN_PLAYERS:-1}
      Matchmaking__MaxPlayers: ${COOP_MAX_PLAYERS:-10}
      Matchmaking__MatchStartDelaySeconds: ${COOP_MATCH_START_DELAY_SECONDS:-2}
      Matchmaking__QueueTimeoutSeconds: ${COOP_QUEUE_TIMEOUT_SECONDS:-60}
      Matchmaking__ConnectionTicketLifetimeSeconds: ${COOP_TICKET_LIFETIME_SECONDS:-120}
      Logging__LogLevel__Games.MassiveServer: ${GAME_SERVER_LOG_LEVEL:-Debug}
    depends_on:
      auth-api:
        condition: service_started
    ports:
      - "127.0.0.1:${COOP_MATCHMAKING_API_PORT:-5002}:8080"
      - "${GAME_SERVER_UDP_BIND_ADDRESS:-127.0.0.1}:${COOP_GAME_SERVER_UDP_PORT:-9051}:${COOP_GAME_SERVER_UDP_PORT:-9051}/udp"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/plataforma-web/Dockerfile
    environment:
      AUTH_API_BASE_URL: http://auth-api:8080
      MASSIVE_API_BASE_URL: http://massive-server:8080
      COOP_API_BASE_URL: http://coop-server:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      auth-api:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  auth_api_data_protection_keys:
    name: plataforma_auth_api_data_protection_keys
  mysql_data:
